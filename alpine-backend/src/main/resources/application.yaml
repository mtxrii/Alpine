spring:
  application:
    name: alpine-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/alpine}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: ${PORT:8080}

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:alpine-backend}
      secret: ${JWT_SECRET:change-me-in-production-with-at-least-32-characters}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT2H}
