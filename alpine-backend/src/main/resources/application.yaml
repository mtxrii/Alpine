spring:
  application:
    name: alpine-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/alpine}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: ${PORT:8080}
